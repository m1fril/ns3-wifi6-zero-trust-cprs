# Mesh scenario: 802.11s (HWMP) multi-hop network, 2 gateways + 23 mesh routers on a 5x5 grid.
# Every router sends UDP to its nearest gateway; packets are relayed hop by hop.
# Same CLI overrides as config.yaml: --set sim.args.meshSpacing=25 --set run.replicas=10

sim:
  binary: ../build/scratch/network-project/ns3.46.1-network-project-main-optimized
  duration: 60
  args:
    topology: mesh             # infra | mesh
    meshLayout: grid           # grid | random (uniform in roomSize x roomSize)
    meshSpacing: 30            # m between grid neighbours; radio range is ~51 m (see README)
    roomSize: 150              # used by meshLayout=random
    nAps: 2                    # gateways (traffic sinks), placed at opposite grid slots
    nStas: 23                  # mesh routers = node pool for churn
    pktInterval: 20000
    pSize: 500
    compactMetrics: 1
    # 802.11s peer-link timeouts. ns-3 defaults (2 lost beacons / 2 failed frames) tear links
    # down under any load; Linux mac80211 is far more tolerant. Remove to study the defaults.
    ns3::dot11s::PeerLink::MaxBeaconLoss: 10
    ns3::dot11s::PeerLink::MaxPacketFailure: 10

run:
  name: mesh-demo
  output_dir: runs
  replicas: 3
  max_parallel: 3
  base_seed: 1
  max_restarts: 1
  grace_period_s: 10

churn:                         # router failures / joins
  initial_active: 20
  min_active: 14
  max_active: 23
  rate_per_s: 0.3
  fail_probability: 0.5
  restart_probability: 0.5
  restart_downtime_s: [2, 8]
  ap_failures:                 # gateway outage: its routers lose their sink
    rate_per_s: 0.01
    downtime_s: [3, 6]
  scale:
    - {at: 30, active: 23}

traffic:                       # a single-channel 802.11a mesh carries a few Mbit/s end to end
  profiles:
    sensor:
      weight: 3
      size: {dist: uniform, min: 64, max: 256}
      interval_us: {dist: exp, mean: 100000, max: 1000000}
    telemetry:
      weight: 2
      size: {dist: normal, mean: 512, std: 128, min: 64, max: 1024}
      interval_us: {dist: uniform, min: 20000, max: 60000}
    camera:
      weight: 1
      size: {dist: const, value: 1200}
      interval_us: {dist: const, value: 20000}
  bursts:
    rate_per_s: 0.1
    nodes: [1, 3]
    packets: [50, 150]
    gap_us: 2000
  profile_swap_rate_per_s: 0.03

network:
  rules:
    - {at: 15, until: 25, target: "cell:1", delay_ms: 20, jitter_ms: 5, loss: 0.02}
    - {at: 40, until: 45, target: "sta:10-12", isolate: true}
  random_impairments:
    rate_per_s: 0.03
    duration_s: [2, 6]
    delay_ms: [5, 40]
    jitter_ms: [0, 5]
    loss: [0.0, 0.1]

script:
  - "50 NODE sta:5-9 down"     # a whole region fails: routes must go around it
  - "55 NODE sta:5-9 up"
